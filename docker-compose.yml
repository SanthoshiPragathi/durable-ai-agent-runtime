# PostgreSQL, the API and worker processes.
#   docker compose up -d --build --scale worker=3     # three workers sharing the runs
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: durable
      POSTGRES_PASSWORD: durable   # local development only
      POSTGRES_DB: durable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/durable
      SERVICES_DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/fake_services
      EXECUTION_MODE: workers   # the API records runs; the worker service executes them
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.engine.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/durable
      SERVICES_DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/fake_services
      LEASE_DURATION_SECONDS: "15"
      HEARTBEAT_INTERVAL_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
