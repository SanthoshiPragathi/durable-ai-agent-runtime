[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-ai-agent-runtime"
version = "0.1.0"
description = "Crash-safe, replayable, forkable execution engine for AI workflows"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running PostgreSQL",
    "recovery: crash/restart scenarios using failpoints",
    "concurrency: multi-worker scenarios",
    "chaos: randomized fault injection (slow)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
